name: massa
description: Massa package  is an SDK that connects your Dart and Flutter applications to the Massa blockchain, create wallet, send transactions, and work with smart contracts.
version: 1.9.7
repository: https://github.com/nafsilabs/massa-dart
homepage: https://nafsi.world

environment:
  sdk: ">=3.0.0<4.0.0"

dependencies:
  base_codecs: ^1.0.1 # base_codecs support base16, base32, base58 and base85
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  hex: ^0.2.0
  retry: ^3.1.2
  protobuf: ^3.1.0
  fixnum: ^1.1.0
  grpc: ^4.0.1
  http: ^1.2.2
  binary: ^3.0.1

dev_dependencies:
  lints: ^4.0.0
  melos: ^6.1.0
  test: ^1.25.8
